name: Java test with caching

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hent projektet
        uses: actions/checkout@692973e3d9371296bf400492193297591b650731 # v4.2.2

      - name: Installer Java 25
        uses: actions/setup-java@7a63335e23812822971207917726359f428d9c57 # v4.7.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Gem Maven-filer
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Byg projektet og kør tests
        run: mvn -B test
